name: Djinni CI listing debug

# Throwaway diagnostic: compares what the Djinni listing returns to the
# GitHub-hosted runner IP under minimal vs. browser-like request headers.
# Read-only — sends no Telegram message and commits nothing. Delete once the
# question is answered.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe Djinni listing under two header sets
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import urllib.request

          import scrapers

          TAGS = {
              "Product Design": "https://djinni.co/jobs/?primary_keyword=Product%20Design",
              "UI UX": "https://djinni.co/jobs/?primary_keyword=UI%20UX",
          }
          TARGETS = {"809438", "822766", "840509"}

          MIN = [("User-Agent", scrapers.USER_AGENT)]
          RICH = [
              ("User-Agent", scrapers.USER_AGENT),
              ("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"),
              ("Accept-Language", "uk-UA,uk;q=0.9,en-US;q=0.8,en;q=0.7"),
              ("Referer", "https://djinni.co/jobs/"),
              ("Upgrade-Insecure-Requests", "1"),
          ]

          def opener(headers):
              jar = http.cookiejar.CookieJar()
              op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
              op.addheaders = headers
              return op

          for label, heads in (("MIN (User-Agent only)", MIN), ("RICH (browser-like)", RICH)):
              print("##### HEADERS:", label)
              op = opener(heads)
              for tag, base in TAGS.items():
                  found = set()
                  for page in (1, 2, 3):
                      try:
                          html = op.open("%s&page=%d" % (base, page), timeout=30).read().decode("utf-8", "replace")
                      except Exception as exc:  # noqa: BLE001 - diagnostic
                          print("  %-15s p%d ERROR %s" % (tag, page, exc))
                          break
                      items = scrapers._parse_djinni_ld(html)
                      ids = [it["id"] for it in items]
                      found.update(ids)
                      rel_next = ('rel="next"' in html) or ("rel=next" in html)
                      hits = [t for t in TARGETS if t in ids]
                      print("  %-15s p%d items=%2d rel_next=%-5s hits=%s" % (tag, page, len(items), rel_next, hits))
                      if not items:
                          break
                  print("  %-15s TOTAL found=%d targets_in_tag=%s" % (tag, len(found), sorted(TARGETS & found)))
              print()
          PY
