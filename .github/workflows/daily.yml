name: Daily design vacancy report

# Runs the DOU + Djinni scraper twice a day, sends the report to Telegram, then
# opens a pull request with the report and merges it automatically. GitHub-hosted
# runners have the outbound network access the Claude Code cloud sandbox denies
# by egress policy, so the scraping runs here.

on:
  schedule:
    # 07:00 UTC = 10:00 Europe/Kyiv, 18:00 UTC = 21:00 Europe/Kyiv.
    - cron: "0 7 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report
        run: python3 daily_report.py

      - name: Send report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          REPORT="reports/report-${DATE}.md"
          if [ ! -f "$REPORT" ]; then
            echo "No report file to send."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${REPORT}" \
            -F caption="Design вакансії — ${DATE} (за останні 3 дні)"

      - name: Open and merge report PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to report."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-report-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "Daily report $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Daily report $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body "Automated Product Design / UI/UX vacancy report from DOU and Djinni."
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              exit 0
            fi
            echo "merge not ready yet (attempt $i), retrying..."
            sleep 6
          done
          echo "Could not merge the report PR automatically." >&2
          exit 1
