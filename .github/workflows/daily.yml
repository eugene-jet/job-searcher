name: Daily design vacancy report

# Runs the DOU + Djinni scraper twice a day, sends the report to Telegram as
# inline message(s), then opens a pull request with the report and merges it
# automatically. GitHub-hosted runners have the outbound network access the
# Claude Code cloud sandbox denies by egress policy, so the scraping runs here.

on:
  # Triggered externally by the Cloudflare Worker in trigger/ via workflow_dispatch.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: when set, the report also sends to everyone who subscribed
          # to the bot with /start and retires chats that blocked it. See
          # trigger/README.md. Both are unset until the subscription bot is live.
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          DEACTIVATE_URL: ${{ secrets.DEACTIVATE_URL }}
        run: python3 daily_report.py

      - name: Open and merge report PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to report."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-report-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "Daily report $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          # gh pr create occasionally hits a transient GitHub API error, such
          # as an HTTP 502 from the GraphQL endpoint. Retry before giving up,
          # and treat a PR already created by an earlier flaky attempt as
          # success so the branch never strands without a pull request.
          for i in 1 2 3 4 5; do
            if gh pr create --base main --head "$BRANCH" \
                --title "Daily report $(date -u +'%Y-%m-%d %H:%M UTC')" \
                --body "Automated Product Design / UI/UX vacancy report from DOU and Djinni."; then
              break
            fi
            if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
              echo "Report PR already exists, continuing."
              break
            fi
            if [ "$i" = 5 ]; then
              echo "Could not create the report PR." >&2
              exit 1
            fi
            echo "pr create failed (attempt $i), retrying..."
            sleep 6
          done
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              exit 0
            fi
            echo "merge not ready yet (attempt $i), retrying..."
            sleep 6
          done
          echo "Could not merge the report PR automatically." >&2
          exit 1
