name: Daily design vacancy report

# Runs the DOU + Djinni scraper twice a day, sends the report to Telegram as
# inline message(s), then opens a pull request with the report and merges it
# automatically. GitHub-hosted runners have the outbound network access the
# Claude Code cloud sandbox denies by egress policy, so the scraping runs here.

on:
  # Triggered externally by the Cloudflare Worker in trigger/ via workflow_dispatch.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 daily_report.py

      - name: Open and merge report PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to report."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-report-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "Daily report $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Daily report $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body "Automated Product Design / UI/UX vacancy report from DOU and Djinni."
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              exit 0
            fi
            echo "merge not ready yet (attempt $i), retrying..."
            sleep 6
          done
          echo "Could not merge the report PR automatically." >&2
          exit 1
