name: Tests

# Runs the offline unit test suite on every push and pull request. The tests
# use in-memory fixtures and never touch the network, so they pass in the
# sandboxed CI environment that cannot reach the job boards.

on:
  push:
    branches: [main]
  # The daily report opens a pull request that only touches generated artifacts
  # (reports/ and data/) and squash-merges it within seconds, deleting the head
  # branch. That deletion races the pull_request-triggered test run: the branch
  # is often gone before a runner starts, so the run ends in a startup failure
  # with no jobs. Those PRs carry no code to test, so skip them by ignoring the
  # paths they change; runs still fire for any pull request that touches code.
  pull_request:
    paths-ignore:
      - 'reports/**'
      - 'data/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
