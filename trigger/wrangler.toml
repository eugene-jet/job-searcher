name = "job-searcher-trigger"
main = "worker.js"
compatibility_date = "2025-01-01"

# UTC: 09:00 UTC = 12:00 Europe/Kyiv (summer),
# 18:00 UTC = 21:00 Europe/Kyiv (summer). Cloudflare cron is UTC-only, just like
# GitHub's schedule, so the wall-clock time shifts by an hour across DST exactly
# as it did before — the only thing that changes is punctuality.
# One expression for every tick: on the hour and on the half hour, from 6:00 to
# 20:30 UTC, which is 9:00 to 23:30 Europe/Kyiv in summer and 8:00 to 22:30 in
# winter (TICK_SPAN_UTC in worker.js mirrors this span). That is 30 ticks a day, of
# which scheduled() in worker.js turns two — 9:00 and 18:00 UTC exactly — into
# the real report and the other 28 into a refresh that only updates the digest
# the bot serves on /start.
#
# Deliberately a single expression. Two expressions that match the same minute
# fire scheduled() twice, and on a report minute that means the digest goes out
# to every subscriber twice over; with one expression the case cannot arise.
#
# Nights are left out: vacancies are not posted at 04:00, and an idle refresh
# would scrape both boards for nobody.
[triggers]
crons = ["0,30 6-20 * * *"]

# Holds the bot's subscriber list (one `sub:<chat_id>` record each). Create the
# namespace once with `wrangler kv namespace create SUBSCRIBERS` and paste the
# id it prints below. Chat ids are personal data and live only here.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "3ee1d84667564f94a3a31d4eee53807e"
