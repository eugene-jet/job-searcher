name = "job-searcher-trigger"
main = "worker.js"
compatibility_date = "2025-01-01"

# UTC: 09:00 UTC = 12:00 Europe/Kyiv (summer),
# 18:00 UTC = 21:00 Europe/Kyiv (summer). Cloudflare cron is UTC-only, just like
# GitHub's schedule, so the wall-clock time shifts by an hour across DST exactly
# as it did before — the only thing that changes is punctuality.
[triggers]
crons = ["0 9 * * *", "0 18 * * *"]

# Holds the bot's subscriber list (one `sub:<chat_id>` record each). Create the
# namespace once with `wrangler kv namespace create SUBSCRIBERS` and paste the
# id it prints below. Chat ids are personal data and live only here.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "3ee1d84667564f94a3a31d4eee53807e"
